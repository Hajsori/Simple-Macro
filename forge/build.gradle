plugins {
    id "multiloader-loader"
    id "net.minecraftforge.gradle" version "[7.0.17,8)"
    id "net.minecraftforge.jarjar" version "0.2.3"
}

base {
    archivesName = "${mod_id}-forge"
}

jarJar.register()

tasks.named("jarJar") {
    archiveClassifier = null
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir("run")

            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            systemProperty "forge.enabledGameTestNamespaces", mod_id
        }


        register("client")

        register("server") {
            args "--nogui"
        }

        register("gameTestServer")

        register("data") {
            workingDir = layout.projectDirectory.dir("run-data")

            args "--mod", mod_id, "--all", "--output", layout.projectDirectory.dir("src/generated/resources"), "--existing", layout.projectDirectory.dir("src/main/resources")
        }
    }
}

sourceSets.main.resources.srcDir "src/generated/resources"

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${min_minecraft_version}-${forge_version}")
    annotationProcessor("org.spongepowered:mixin:0.8.7:processor")

    implementation("net.sf.jopt-simple:jopt-simple:5.0.4") { version { strictly "5.0.4" } }

    // WebSocket
    implementation "org.java-websocket:Java-WebSocket:${websocket_version}"
    jarJar("org.java-websocket:Java-WebSocket:${websocket_version}")

    // Simple Voice Chat
    implementation "maven.modrinth:simple-voice-chat:forge-${svc_version}"


    jarJar('io.github.llamalad7:mixinextras-forge:0.5.0')
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

tasks.named("jar", Jar) {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_author,
                "Specification-Version"   : version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_author
        ])
        attributes["MixinConfigs"] = "${mod_id}.mixins.json"
    }
}
